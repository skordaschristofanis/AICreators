# SPDX-License-Identifier: MIT

[project]
name = "aicreators"
version = "0.1.0"
authors = [
    {name = "Christofanis Skordas", email = "skordasc@uchicago.edu"}
]
maintainers = [
    {name = "Christofanis Skordas", email = "skordasc@uchicago.edu"}
]
description = "Content creation tools with online/offline LLM API calls."
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE.txt"}
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14"
]
requires-python = "==3.14.*"
dependencies = []

[dependency-groups]
dev = []
docs = []

[project.scripts]
aicreators = "aicreators:main"

[project.urls]
Homepage = "https://github.com/skordaschristofanis/AICreators"
Issues = "https://github.com/skordaschristofanis/AICreators/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aicreators"]

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "build",
    "dist",
]
line-length = 160
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"